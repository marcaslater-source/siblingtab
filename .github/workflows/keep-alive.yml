name: Supabase keep-alive

# Supabase's free tier pauses a project after 7 days without activity.
# This makes one tiny database request every 3 days so that never happens.
# It uses only the public (publishable) key that is already in app/config.js.
on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the SiblingTab database
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 \
            -H 'apikey: sb_publishable_4aPpt4-26ewsdMeoTjguCA_qJdI-Tqv' \
            'https://oeoztluulroglfbvwyon.supabase.co/rest/v1/profiles?select=id&limit=1')
          echo "Supabase answered: $code"
          test "$code" = "200"
